name: release

# Triggers automatically whenever a GitHub Release is published, building
# native installers for Windows x64 and macOS (Intel + Apple Silicon) and
# uploading every installer directly to that same release as downloadable
# assets. Can also be run manually from the Actions tab (workflow_dispatch)
# for a test build that uploads workflow artifacts instead of touching a
# release, which is useful for verifying the build works before cutting
# an actual release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            platform: windows-latest
            rust_target: x86_64-pc-windows-msvc
          - name: macos-x64
            platform: macos-latest
            rust_target: x86_64-apple-darwin
          - name: macos-arm64
            platform: macos-latest
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Detects which package manager this repo actually uses by checking
      # for a lockfile, rather than assuming npm. This avoids hardcoding a
      # `cache: npm` (or yarn/pnpm) input on setup-node, which fails the
      # whole job with "Dependencies lock file is not found" if that exact
      # lockfile isn't present -- e.g. a pnpm or yarn project that has no
      # package-lock.json at all.
      - name: Detect package manager
        id: pm
        shell: bash
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
          else
            echo "No lockfile found (package-lock.json, yarn.lock, or pnpm-lock.yaml)." >&2
            exit 1
          fi

      - name: Set up pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          # Used only as a fallback when package.json has no
          # "packageManager" field pinning a version; if it does, that
          # value takes precedence automatically.
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ steps.pm.outputs.manager }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        shell: bash
        run: |
          case "${{ steps.pm.outputs.manager }}" in
            pnpm) pnpm install --frozen-lockfile ;;
            yarn) yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Build Tauri app (${{ matrix.name }})
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.rust_target }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleDir = "src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis"
          $setupExe = Get-ChildItem -Path $bundleDir -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $setupExe) { throw "No NSIS installer found in $bundleDir" }

          $stagingDir = "dist-staging"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item $setupExe.FullName -Destination "$stagingDir/ImageConverterPro-${{ matrix.name }}-Setup.exe"

          Get-ChildItem $stagingDir

      - name: Package macOS .dmg
        if: runner.os == 'macOS'
        run: |
          set -euxo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg"
          STAGING_DIR="dist-staging"
          mkdir -p "$STAGING_DIR"

          DMG_PATH=$(find "$BUNDLE_DIR" -name "*.dmg" | head -n1)
          if [ -z "$DMG_PATH" ]; then echo "No .dmg found in $BUNDLE_DIR" >&2; exit 1; fi
          cp "$DMG_PATH" "$STAGING_DIR/ImageConverterPro-${{ matrix.name }}.dmg"

          ls -la "$STAGING_DIR"

      - name: Upload installers to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist-staging/*
          fail_on_unmatched_files: true

      - name: Upload workflow artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverterPro-${{ matrix.name }}
          path: dist-staging/*
          if-no-files-found: error
